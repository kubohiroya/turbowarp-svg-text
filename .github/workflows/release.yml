name: Release

on:
  workflow_dispatch:
    inputs:
      finalize_tags_only:
        description: Synchronize tags for the verified published version without publishing
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag matches package version
        run: node scripts/check-release-consistency.ts
      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../turbowarp-svg-text.zip .
      - name: Create npm package archive
        run: npm pack --ignore-scripts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/svg-text.js
            dist/composition.js
            kubohiroya-turbowarp-svg-text-*.tgz
            turbowarp-svg-text.zip

  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.finalize_tags_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0
      - name: Download verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.11.0 --repo kubohiroya/turbowarp-svg-text --pattern kubohiroya-turbowarp-svg-text-0.11.0.tgz
          echo '6f6de76e793e6f2d367dc35fa29170177c834495  kubohiroya-turbowarp-svg-text-0.11.0.tgz' | sha1sum --check
          tar -xOf kubohiroya-turbowarp-svg-text-0.11.0.tgz package/package.json > package-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package-metadata.json')); if (p.name !== '@kubohiroya/turbowarp-svg-text' || p.version !== '0.11.0') throw new Error('Unexpected package');"
      - name: Publish verified tarball with provenance
        run: npm publish ./kubohiroya-turbowarp-svg-text-0.11.0.tgz --access public --provenance

  finalize-published-tags:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.finalize_tags_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - name: Verify published artifact and synchronize release tags
        env:
          RELEASE_PACKAGE: "@kubohiroya/turbowarp-svg-text"
          RELEASE_VERSION: "0.11.0"
          RELEASE_SHA1: "6f6de76e793e6f2d367dc35fa29170177c834495"
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {RELEASE_PACKAGE: name, RELEASE_VERSION: version, RELEASE_SHA1: sha1} = process.env;
          const main = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(main.name, name, 'Unexpected package on main');
          assert.equal(main.version, version, 'Main has advanced');
          const npm = (...args) => execFileSync('npm', args, {encoding: 'utf8'});
          const published = JSON.parse(npm('view', `${name}@${version}`, '--json', '--prefer-online'));
          assert.equal(published.name, name);
          assert.equal(published.version, version);
          assert.equal(published.dist.shasum, sha1, 'Published artifact differs');
          const readTags = () => JSON.parse(npm('view', name, 'dist-tags', '--json', '--prefer-online'));
          const tags = readTags();
          for (const tag of ['latest', 'next']) {
            if (tags[tag] !== version) npm('dist-tag', 'add', `${name}@${version}`, tag);
          }
          let complete = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const actual = readTags();
            if (actual.latest === version && actual.next === version) {
              console.log(JSON.stringify({package: name, version, ...actual}));
              complete = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert(complete, 'Release tags have not converged');
          NODE
