name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag matches package version
        run: node scripts/check-release-consistency.ts
      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../turbowarp-svg-text.zip .
      - name: Create npm package archive
        run: npm pack --ignore-scripts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/svg-text.js
            dist/composition.js
            kubohiroya-turbowarp-svg-text-*.tgz
            turbowarp-svg-text.zip

  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0
      - name: Download verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.11.0 --repo kubohiroya/turbowarp-svg-text --pattern kubohiroya-turbowarp-svg-text-0.11.0.tgz
          echo '6f6de76e793e6f2d367dc35fa29170177c834495  kubohiroya-turbowarp-svg-text-0.11.0.tgz' | sha1sum --check
          tar -xOf kubohiroya-turbowarp-svg-text-0.11.0.tgz package/package.json > package-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package-metadata.json')); if (p.name !== '@kubohiroya/turbowarp-svg-text' || p.version !== '0.11.0') throw new Error('Unexpected package');"
      - name: Publish verified tarball with provenance
        run: npm publish ./kubohiroya-turbowarp-svg-text-0.11.0.tgz --access public --provenance
